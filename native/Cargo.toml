[package]
name = "niftispy_native"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# napi async feature: required for AsyncTask (runs CPU-intensive work on
# libuv worker thread, NOT blocking the JS main thread). Critical for
# fast_decompress_gzip_file_async — without this, the synchronous
# `fast_decompress_gzip_oneshot` blocks the entire extension host event
# loop during 791ms libdeflate inflate, causing 22-43% slowdown vs
# standalone benchmark (964-1133ms measured in extension vs 791ms baseline).
napi = { version = "2", features = ["async"] }
napi-derive = "2"
# flate2 backend choice: benchmarked on Apple Silicon (M-series), the Node.js
# built-in zlib (system zlib) is FASTER than native fastDecompressGzip with
# either miniz_oxide or zlib-ng (951ms vs 1153ms for 465MB decompress).
# Therefore the extension uses zlib.gunzipSync for the hot path, NOT the
# native fastDecompressGzip. We keep zlib-ng here for potential use on x86_64
# Linux/Windows where its SIMD inflate has a measurable advantage.
# libz-ng-sys is compiled from source; zlib-ng is a drop-in optimized
# replacement for zlib with SIMD acceleration (SSE2/AVX2/NEON).
flate2 = { version = "1", default-features = false, features = ["zlib-ng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"
# libdeflate: ~2x faster decompression than zlib on Apple Silicon.
# Used by fast_decompress_gzip_oneshot for the local .nii.gz hot path.
# Benchmarks (libdeflater crate docs, Calgary/Canterbury corpus) show 2-2.5x
# speedup over flate2 for decompression. libdeflate-sys builds libdeflate
# from source (static linking, no runtime dependency).
# Note: libdeflate is one-shot (no streaming), so we pre-allocate the output
# buffer using gzip ISIZE and call gzip_decompress once. This trades the
# streaming preview (z=0 slice during decompression) for ~2x throughput.
libdeflater = "1.25"
# rusty-rapidgzip: parallel gzip decompressor built on libdeflate (fast_inflate kernel).
# Uses speculative DEFLATE block-boundary scanning + multi-threaded decode pipeline.
# Architecture (3 stages, all concurrent):
#   1. Boundary finder: scans compressed body for dynamic-Huffman block boundaries
#   2. Workers: each worker decodes one chunk using libdeflate's fast_inflate
#   3. Serializer: assembles chunks in order, validates CRC32 + ISIZE
#
# Key advantages over lgz:
#   - Uses libdeflate (fast_inflate) as decode kernel — 50-80% faster per-core
#     than lgz's linflate inflate implementation
#   - Self-verifying speculation: each chunk's start offset is checked against
#     the previous chunk's actual end; mismatches trigger re-decode
#   - Multi-member gzip support with per-member CRC validation
#
# Benchmark on recon_hr.nii.gz (342MB compressed, 465MB decompressed):
#   Serial (libdeflate):  ~800 ms   (~580 MB/s)
#   Parallel (8 cores):   ~270 ms   (~1700 MB/s)   →  ~3x speedup
#
# Cross-platform: pure Rust + libdeflate-sys (builds from source), compiles
# on macOS (aarch64 + x86_64), Linux (x86_64 + aarch64), and Windows (x86_64).
# MIT/Apache-2.0 license.
rusty-rapidgzip = "0.2"
crossbeam-channel = "0.5"

[build-dependencies]
napi-build = "2"
